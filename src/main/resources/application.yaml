gg:
  jte:
    development-mode: true
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: job-application-tracker
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  auth:
    throttling:
      login-per-ip: ${AUTH_LOGIN_PER_IP:20}
      login-per-account: ${AUTH_LOGIN_PER_ACCOUNT:10}
      registration-per-ip: ${AUTH_REGISTRATION_PER_IP:5}
      verification-per-ip: ${AUTH_VERIFICATION_PER_IP:20}
      verification-per-account: ${AUTH_VERIFICATION_PER_ACCOUNT:10}
      resend-per-ip: ${AUTH_RESEND_PER_IP:5}
      resend-per-account: ${AUTH_RESEND_PER_ACCOUNT:3}
      login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:900}
      registration-window-seconds: ${AUTH_REGISTRATION_WINDOW_SECONDS:3600}
      verification-window-seconds: ${AUTH_VERIFICATION_WINDOW_SECONDS:900}
      resend-window-seconds: ${AUTH_RESEND_WINDOW_SECONDS:3600}
